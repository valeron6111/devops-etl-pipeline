name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build ETL Docker Image
      run: |
        docker build -t etl-image ./etl

    - name: Build DBT Docker Image
      run: |
        docker build -t dbt-image ./dbt

    - name: Push Images to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker tag etl-image your-dockerhub-username/etl-image:latest
        docker tag dbt-image your-dockerhub-username/dbt-image:latest
        docker push your-dockerhub-username/etl-image:latest
        docker push your-dockerhub-username/dbt-image:latest
